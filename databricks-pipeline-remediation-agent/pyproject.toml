[project]
name = "databricks-pipeline-remediation-agent"
version = "0.1.0"
description = "FastAPI webhook receiver that classifies DLT pipeline errors and raises Teams notifications for non-transient failures."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "mlflow>=3.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
