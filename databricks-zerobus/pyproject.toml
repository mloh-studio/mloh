[project]
name = "databricks-zerobus-demo"
version = "0.1.0"
description = "End-to-end Databricks Zerobus Ingest demo: external producer -> UC Delta table -> Lakeflow pipeline."
requires-python = ">=3.11"
dependencies = [
    "databricks-zerobus-ingest-sdk>=1.11.0",
]

[project.scripts]
zerobus-produce = "zerobus_demo.producer:main"
zerobus-produce-rest = "zerobus_demo.rest_producer:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerobus_demo"]
